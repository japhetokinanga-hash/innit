<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Officer login - ShambaPulse</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600&amp;family=Source+Serif+4:wght@600&amp;display=swap">
<link rel="stylesheet" href="../css/style.css">
</head>
<body class="inner">
<header><h1>ShambaPulse</h1><p>Officer login</p></header>
<main class="admin-wrap">
  <div class="panel">
    <p id="login-error" class="notice error" role="alert" hidden></p>
    <form id="login-form">
      <label for="u">Username</label><input id="u" name="username" required autofocus autocomplete="username">
      <label for="p">Password</label><input id="p" name="password" type="password" required autocomplete="current-password">
      <button class="hero-button" type="submit">Log in</button>
    </form>
  </div>
</main>
<script src="../js/admin-login.js" defer></script>
</body>
</html>
