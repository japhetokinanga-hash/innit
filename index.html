<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Officer dashboard - ShambaPulse</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600&amp;family=Source+Serif+4:wght@600&amp;display=swap">
<link rel="stylesheet" href="../css/style.css">
</head>
<body class="inner">
<header><h1>ShambaPulse</h1><p>Officer dashboard &middot; <a href="#" id="logout" style="color:#e2a72e">Log out</a></p></header>
<main class="admin-wrap">
  <p id="flash" class="notice" role="status" hidden></p>

  <div class="panel"><h2>Subscribers by county</h2>
    <table><thead><tr><th>County</th><th>Subscribed farmers</th></tr></thead><tbody id="subs-body"></tbody></table></div>

  <div class="panel"><h2>New alert</h2>
    <form id="alert-form">
      <label>County <select name="county_id" id="county-select"></select></label>
      <label>Type <select name="type"><option value="weather">Weather</option><option value="advisory">Advisory</option><option value="market">Market</option></select></label>
      <label>English (max 160) <textarea name="body_en" maxlength="160" rows="2" required></textarea></label>
      <label>Kiswahili (max 160) <textarea name="body_sw" maxlength="160" rows="2" required></textarea></label>
      <label><input type="checkbox" name="send_now" style="width:auto"> Send now (otherwise save as draft)</label>
      <button class="hero-button" type="submit">Save alert</button>
    </form></div>

  <div class="panel"><h2>Alerts</h2>
    <table><thead><tr><th>#</th><th>County</th><th>Type</th><th>Status</th><th>Delivered / Failed / Total</th><th>Message</th><th></th></tr></thead><tbody id="alerts-body"></tbody></table></div>

  <div class="panel"><h2>Add / update a price</h2>
    <form id="price-form">
      <input name="commodity" placeholder="Commodity (e.g. Maize)" required>
      <input name="unit" placeholder="Unit (e.g. 90 kg bag)" required>
      <input name="market" placeholder="Market" required>
      <input name="price_date" type="date" required>
      <input name="price_kes" type="number" step="0.01" min="0.01" placeholder="Price (KES)" required>
      <button class="hero-button" type="submit">Save price</button>
    </form></div>

  <div class="panel"><h2>Contact messages</h2>
    <table><thead><tr><th>When</th><th>Name</th><th>Email</th><th>Role</th><th>Message</th></tr></thead><tbody id="msgs-body"></tbody></table></div>
</main>
<script src="../js/admin.js" defer></script>
</body>
</html>
